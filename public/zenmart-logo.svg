<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient: Teal to Amber Orange -->
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#14959E" />
      <stop offset="35%" stop-color="#2DA0A7" />
      <stop offset="70%" stop-color="#DE8C1D" />
      <stop offset="100%" stop-color="#EA9116" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="20%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#EA8B12" />
      <stop offset="100%" stop-color="#F29815" />
    </linearGradient>

    <!-- Teal Cart Color -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#108D96" />
      <stop offset="100%" stop-color="#199CA5" />
    </linearGradient>
  </defs>

  <!-- Clean Background Circle -->
  <circle cx="250" cy="250" r="236" fill="#FFFFFF" />

  <!-- Outer Gradient Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Shopping Cart Body (Teal) -->
  <g id="cart">
    <!-- Handle & Outer Frame -->
    <path
      d="M 162 148 
         C 152 148, 146 154, 150 162
         L 194 266
         C 198 274, 206 278, 218 278
         L 310 278
         C 318 278, 322 272, 322 265
         C 322 258, 318 253, 310 253
         L 223 253
         C 217 253, 213 250, 210 244
         L 204 230
         L 262 230
         C 272 230, 278 223, 274 213
         L 248 184
         C 244 180, 238 178, 230 178
         L 198 178
         C 192 178, 186 174, 184 168
         L 180 156
         C 177 150, 170 148, 162 148 Z"
      fill="#14959E"
    />

    <!-- Upper Cart Rim Segment (Teal) -->
    <path
      d="M 196 166
         L 264 166
         C 274 166, 280 172, 276 182
         L 245 220
         C 242 224, 236 226, 230 226
         L 200 226
         C 194 226, 188 222, 186 216
         L 182 206
         C 180 200, 184 194, 190 194
         L 240 194
         L 254 178
         L 194 178
         C 186 178, 184 170, 188 166 Z"
      fill="#14959E"
      opacity="0.95"
    />

    <!-- Front Bumper Bar -->
    <path
      d="M 215 258 
         L 302 258
         C 308 258, 312 262, 312 266
         C 312 270, 308 274, 302 274
         L 215 274
         Z"
      fill="#14959E"
    />

    <!-- Cart Wheel Left -->
    <circle cx="225" cy="304" r="18" fill="none" stroke="#14959E" stroke-width="8" />
    <circle cx="225" cy="304" r="7" fill="#14959E" />

    <!-- Cart Wheel Right -->
    <circle cx="288" cy="304" r="18" fill="none" stroke="#14959E" stroke-width="8" />
    <circle cx="288" cy="304" r="7" fill="#14959E" />
  </g>

  <!-- Growth Arrow Zig-Zag (Amber Orange) -->
  <g id="growth-arrow">
    <!-- Main Arrow Ribbon Line -->
    <path
      d="M 194 250
         L 226 214
         C 230 210, 236 210, 240 214
         L 258 238
         C 262 243, 269 243, 273 238
         L 336 156
         L 348 140
         C 350 137, 354 139, 353 143
         L 344 196
         C 343 200, 338 202, 335 199
         L 326 190
         L 272 258
         C 268 263, 260 263, 256 258
         L 238 234
         C 235 230, 229 230, 226 234
         L 204 258
         C 200 262, 192 258, 194 250 Z"
      fill="url(#arrowGrad)"
    />

    <!-- Arrow Head Triangle -->
    <polygon
      points="334,130 366,134 352,168 344,152 334,142"
      fill="url(#arrowGrad)"
    />

    <!-- Highlight Inner Track for 3D Dimension -->
    <path
      d="M 226 220 
         L 258 244 
         C 260 246, 264 246, 266 244 
         L 326 166
         L 316 238
         C 314 242, 318 246, 322 246
         L 346 246"
      fill="none"
      stroke="#EA8B12"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
  </g>

  <!-- Brand Typography: Zenmart -->
  <text
    x="250"
    y="368"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif"
    font-size="50"
    font-weight="800"
    letter-spacing="-0.02em"
    fill="#0C4A5A"
  >
    ZenMart
  </text>

  <!-- Brand Subtitle: স্মার্ট কেনাকাটা, সহজ সমাধান -->
  <text
    x="250"
    y="408"
    text-anchor="middle"
    font-family="'Hind Siliguri', 'Kalpurush', system-ui, sans-serif"
    font-size="20"
    font-weight="700"
    fill="#0C4A5A"
    letter-spacing="0.01em"
  >
    স্মার্ট কেনাকাটা, সহজ সমাধান
  </text>
</svg>
